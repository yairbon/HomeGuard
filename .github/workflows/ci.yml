name: CI

# Runs on every push and PR. The point is that nobody has to remember to run
# the checks by hand — this project's history includes real bugs that a test
# run would have caught immediately (an endpoint reachable with no
# credentials, a 500 on a corrupt upload, a sensor bypass silently lost).
on:
  push:
  pull_request:

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # In-process against the ASGI app — no server to start, no ports, and
        # no real sleeps (clocks are shifted instead of waited out).
        run: pytest -q

  backend-live:
    name: Backend (live end-to-end)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the backend
        # Not a secret: this key exists only for the duration of this job, on
        # a throwaway runner with no hardware attached. The real one is
        # generated per install (see backend/security.py).
        env:
          HOMEGUARD_DEVICE_KEY: ci-device-key
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo "UVICORN_PID=$!" >> "$GITHUB_ENV"
          # `exit 0` on success rather than `break`: with `break`, a run that
          # exhausted all 30 attempts ended on `sleep 1`, so the loop — and
          # the whole step — exited 0 and the job reported a backend that had
          # never bound as started. `bash -e` does not help, because a failing
          # left-hand side of `&&` is exempt from it.
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "::error::the backend never became ready"
          cat uvicorn.log
          exit 1

      - name: Run the live simulation
        # Slower than the pytest suite (it waits out real 30-second lockouts
        # and a real board-heartbeat timeout), but it exercises the actual
        # uvicorn server and WebSocket transport the app talks to.
        env:
          HOMEGUARD_DEVICE_KEY: ci-device-key
        run: python simulate.py

      - name: Check the backend is still alive
        # A server that died partway through turns simulate.py's checks into a
        # bare httpx.ConnectError with no server-side cause anywhere on the
        # page. Catch it here instead, while the log is still worth printing.
        run: kill -0 "$UVICORN_PID"

      - name: Backend log
        # `always()` so the log is available on the failing run, which is the
        # only run anyone reads it on.
        if: always()
        run: cat uvicorn.log

  firmware:
    name: Firmware (compile all four sketches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s -- 0.35.3
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Cache the esp32 core
        # The core install is ~700 MB of SoC variants and toolchains, so a
        # cold run costs several minutes; cached it is closer to one. Keyed on
        # the pinned version below, so a core bump invalidates it deliberately
        # rather than a release reddening CI for reasons unrelated to the
        # change under test.
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11

      - name: Install the esp32 core
        run: |
          arduino-cli config init --additional-urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Generate placeholder secrets
        # secrets.h is gitignored (it holds the WiFi password, the device key
        # and the keypad PIN), so every sketch's #include fails without this.
        # The committed template defines every symbol the four sketches need.
        run: |
          for dir in esp32/*/; do
            [ -f "$dir/$(basename "$dir").ino" ] && cp esp32/secrets.h.example "$dir/secrets.h"
          done

      - name: Compile
        # The ESP32-CAM is a different board with a different FQBN — building
        # it as a plain esp32 silently produces firmware that cannot drive the
        # camera. See esp32/README.md.
        run: |
          for sketch in ultrasonic_sensor vibration_sensor door_keypad_controller; do
            echo "--- $sketch"
            arduino-cli compile --fqbn esp32:esp32:esp32 "esp32/$sketch"
          done
          echo "--- esp32_cam"
          arduino-cli compile --fqbn esp32:esp32:esp32cam esp32/esp32_cam

  app:
    name: App (analyze + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Must provide Dart >= the SDK constraint in app/pubspec.yaml.
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Warnings included: this is a small codebase with no existing
        # warning debt, so keeping it at zero is cheap.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Tests
        run: flutter test

  # Deliberately not built here: the Android APK. It needs the Android
  # SDK/NDK — several GB of runner setup for a course project that builds
  # locally through WSL2 (see CLAUDE.md for why native Windows builds don't
  # work on the dev machine). Verified by hand with `/flutter-build`.
  #
  # The four ESP32 sketches used to be in this list too, on the grounds that
  # they were "verified by hand". They were not: `vibration_sensor/secrets.h`
  # had gone missing on the dev machine, so that sketch could not be compiled
  # at all and nobody noticed — which is exactly what a manual gate looks
  # like once it lapses. Hence the `firmware` job above. It runs in parallel
  # with the other three, so it only lengthens the critical path on a cache
  # miss.
